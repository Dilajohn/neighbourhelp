{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
  <div class="text-center">
    <h1>Welcome to NeighbourHelp</h1>
    {% if current_user.is_authenticated %}
      <p><a class="btn btn-primary" href="{{ url_for('main.report') }}">Report a Community Issue</a></p>
    {% else %}
      <p>Please <a href="{{ url_for('auth.login') }}">log in</a> to report community issues.</p>
    {% endif %}
  </div>
{% endblock %}
