{% extends "base.html" %}
{% block title %}Edit Issue{% endblock %}
{% block content %}
<div class="container my-4">
  <h2 class="mb-4">Edit Issue</h2>

  <div class="card shadow-sm">
    <div class="card-body">
      <form method="POST" action="{{ url_for('admin.edit_issue', issue_id=issue.id) }}" enctype="multipart/form-data">
        {{ csrf_token() }}

        <div class="mb-3">
          <label class="form-label">Title</label>
          <input class="form-control" name="title" value="{{ issue.title }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea class="form-control" name="description" rows="4" required>{{ issue.description }}</textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Location</label>
          <input class="form-control" name="location" value="{{ issue.location or '' }}">
        </div>

        <div class="mb-3">
          <label class="form-label">Category</label>
          <select class="form-select" name="category">
            {% set choices = ['pothole','lights','rubbish'] %}
            {% for c in choices %}
              <option value="{{ c }}" {% if issue.category == c %}selected{% endif %}>{{ c|capitalize }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Status</label>
          <select class="form-select" name="status">
            {% for s in ['open','in_progress','resolved'] %}
              <option value="{{ s }}" {% if issue.status == s %}selected{% endif %}>{{ s|capitalize }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Upload New Image (optional)</label>
          <input class="form-control" type="file" name="image_file" />
          {% if issue.image_filename %}
            <div class="mt-2">
              <img src="{{ url_for('static', filename='uploads/' ~ issue.image_filename) }}" alt="Issue Image" class="img-thumbnail" style="max-height: 150px;">
            </div>
          {% endif %}
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <a href="{{ url_for('admin.view_issue', issue_id=issue.id) }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
