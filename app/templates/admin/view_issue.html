{% extends "base.html" %}
{% block title %}Issue Detail{% endblock %}

{% block content %}
<div class="container my-4">
  <h2 class="mb-4">Issue Details</h2>
  
  <div class="card shadow-sm">
    <div class="card-body">
      <h5 class="card-title">{{ issue.title }}</h5>
      <p class="card-text"><strong>Description:</strong> {{ issue.description }}</p>
      <p class="card-text"><strong>Location:</strong> {{ issue.location }}</p>
      <p class="card-text">
        <strong>Status:</strong>
        <span class="badge {% if issue.status == 'resolved' %}bg-success{% else %}bg-warning text-dark{% endif %}">
          {{ issue.status }}
        </span>
      </p>
    </div>
  </div>

  <div class="mt-4 d-flex gap-2">
    <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
    <a href="{{ url_for('admin.resolve_issue', issue_id=issue.id) }}" class="btn btn-success"
       onclick="return confirm('Mark this issue as resolved?');">Resolve</a>
    <a href="{{ url_for('admin.delete_issue', issue_id=issue.id) }}" class="btn btn-danger"
       onclick="return confirm('Are you sure you want to delete this issue?');">Delete</a>
  </div>
</div>
{% endblock %}
