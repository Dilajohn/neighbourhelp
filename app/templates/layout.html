<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NeighbourHelp</title>
   <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-ENjdO4Dr2bkBIFxQpeo4A6moBv6bU5eZQnN9uFjG4QkK3vfEhTgi0B3zEJAj9OeD"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>
</head>
<body>
  <header><h1>NeighbourHelp</h1></header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
         <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    {% block content %}
    <!-- Content replaced by child templates -->
    {% endblock %}
  </main>
  <footer class="bg-light text-center py-3 mt-5">
    <p class="mb-0">&copy; 2025 NeighbourHelp</p>
  </footer>
  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-qO1cDiVo0FDKcxYX9vuXcdV1l9gX3n6+QLrH5aO4FqEG1SK+jDDoPoE1J+yJKX+C"
    crossorigin="anonymous"
  ></script>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>
</body>
</html>
